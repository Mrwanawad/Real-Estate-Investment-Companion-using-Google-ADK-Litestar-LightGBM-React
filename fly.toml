app = "reic-companion"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "prod"
  LLM_PROVIDER = "gemini"
  CLIENT_IP_HEADER = "Fly-Client-IP"

# Secrets (fly secrets set): DATABASE_URL, GEMINI_API_KEY, BROKER_API_KEY, WEBHOOK_SECRET

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
