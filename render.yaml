# Render Blueprint: free Docker web service for the API (sleeps after 15 min idle).
# Secrets (sync: false) are entered once in the Render dashboard or set with the Render API.
services:
  - type: web
    name: reic-companion
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_ENV
        value: prod
      - key: LLM_PROVIDER
        value: gemini
      - key: CLIENT_IP_HEADER
        value: X-Forwarded-For
      - key: CORS_ORIGINS
        value: '["https://reic-companion.mrwaanawad.workers.dev"]'
      - key: GEMINI_API_KEY
        sync: false
      - key: BROKER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
