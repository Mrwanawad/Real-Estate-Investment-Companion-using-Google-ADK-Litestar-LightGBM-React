[project]
name = "real-estate-investment-companion"
version = "0.1.0"
description = "AI companion that helps real estate buyers compare units, financing and returns"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "httpx>=0.28.1",
    "litestar[standard]>=2.25",
    "numpy>=2",
    "numpy-financial>=1.0,<1.1",
    "pgvector>=0.5.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.10",
    "psycopg[binary]>=3.3",
    "sqlalchemy[asyncio]>=2.0.57,<2.1",
]

[project.optional-dependencies]
agents = [
    "google-adk>=2.14",
    "litellm>=1.108",
]
gemini = [
    "google-genai>=2.30,<3",
]
ml = [
    "lightgbm>=4.7",
    "pandas>=3.1",
    "scikit-learn>=1.8",
    "statsmodels>=0.15",
]
forecast = [
    "prophet>=1.5",
]
retrieval = [
    "sentence-transformers>=6.2",
]
reports = [
    "jinja2>=3.1.6",
    "weasyprint>=70",
]
observability = [
    "litestar[opentelemetry]>=2.25",
    "opentelemetry-exporter-otlp>=1.45",
    "opentelemetry-sdk>=1.45",
]
eval = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not models and not live and not pdf'"
markers = [
    "models: downloads real model weights",
    "live: calls a real LLM or network service",
    "pdf: needs WeasyPrint system libraries",
    "integration: needs Postgres (embedded pgserver or TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.importlinter]
root_package = "reic"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Module layers point inward"
type = "layers"
layers = ["adapters", "application", "ports", "domain"]
containers = [
    "reic.modules.inventory",
    "reic.modules.financing",
    "reic.modules.market",
    "reic.modules.scenarios",
    "reic.modules.knowledge",
    "reic.modules.handoff",
    "reic.modules.reports",
    "reic.modules.companion",
]

[[tool.importlinter.contracts]]
name = "Modules do not import each other"
type = "independence"
modules = [
    "reic.modules.inventory",
    "reic.modules.financing",
    "reic.modules.market",
    "reic.modules.scenarios",
    "reic.modules.knowledge",
    "reic.modules.handoff",
    "reic.modules.reports",
    "reic.modules.companion",
]

[[tool.importlinter.contracts]]
name = "Domain and ports stay free of frameworks and vendors"
type = "forbidden"
source_modules = ["reic.modules.*.domain", "reic.modules.*.ports"]
forbidden_modules = [
    "litestar",
    "google",
    "litellm",
    "anthropic",
    "lightgbm",
    "prophet",
    "statsmodels",
    "sentence_transformers",
    "pandas",
    "sqlalchemy",
    "weasyprint",
    "jinja2",
    "opentelemetry",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Application stays free of frameworks and vendors"
type = "forbidden"
source_modules = ["reic.modules.*.application"]
forbidden_modules = [
    "litestar",
    "google",
    "litellm",
    "anthropic",
    "lightgbm",
    "prophet",
    "statsmodels",
    "sentence_transformers",
    "pandas",
    "sqlalchemy",
    "weasyprint",
    "jinja2",
    "opentelemetry",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Shared does not import modules or bootstrap"
type = "forbidden"
source_modules = ["reic.shared"]
forbidden_modules = ["reic.modules", "reic.bootstrap"]

[[tool.importlinter.contracts]]
name = "Modules do not import bootstrap"
type = "forbidden"
source_modules = ["reic.modules"]
forbidden_modules = ["reic.bootstrap"]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "pgserver>=0.1.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "ruff>=0.17.4",
]
